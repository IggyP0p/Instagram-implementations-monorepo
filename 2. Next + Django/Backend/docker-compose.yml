services:
   django_web:
      build: .
      command: >
         sh -c "python manage.py migrate &&
               python manage.py seed_data &&
               python3 manage.py runserver 0.0.0.0:8000"
      volumes:
         - .:/app
      ports:
         - "8000:8000"
      environment:
         - DEBUG=1
      depends_on:
         postgres_db:
            condition: service_healthy

   postgres_db:
      image: postgres:16-alpine
      container_name: django-postgres
      restart: always
      environment:
         POSTGRES_DB: db_django
         POSTGRES_USER: user_django
         POSTGRES_PASSWORD: secure_key_123
      healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user_django -d db_django"]
            interval: 5s
            timeout: 5s
            retries: 5
      ports:
         - "5432:5432"
      volumes:
         - postgres_data:/var/lib/postgresql/data

volumes:
   postgres_data:
